name: Sync Bulletins Manifest

# Runs automatically whenever a PDF is added/removed/renamed in the bulletins/ folder.
# Result: bulletins-manifest.json is rewritten and committed back, so the
# Insights page picks up the new PDF without any manual JSON editing.
#
# Can also be run manually from the Actions tab via the "Run workflow" button.

on:
  push:
    paths:
      - 'bulletins/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate bulletins-manifest.json from bulletins/*.pdf
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import glob
          import re

          month_order = {
              "january": 1, "february": 2, "march": 3, "april": 4,
              "may": 5, "june": 6, "july": 7, "august": 8,
              "september": 9, "october": 10, "november": 11, "december": 12
          }

          def bulletin_sort_key(path):
              # Filenames must follow: Month-YYYY.pdf  (e.g. March-2026.pdf)
              name = os.path.basename(path).replace('.pdf', '')
              match = re.fullmatch(r'([A-Za-z]+)-(\d{4})', name)
              if not match:
                  # Files that don't match the naming convention sort to the bottom
                  return (0, 0, name.lower())
              month_name, year = match.groups()
              return (int(year), month_order.get(month_name.lower(), 0), name.lower())

          files = sorted(glob.glob('bulletins/*.pdf'), key=bulletin_sort_key, reverse=True)
          bulletins = []
          for f in files:
              name = os.path.basename(f)
              # "March-2026.pdf" -> display "March 2026"
              display = name.replace('.pdf', '').replace('-', ' ')
              bulletins.append({
                  "file": name,
                  "display": display,
                  "path": f"bulletins/{name}"
              })

          with open('bulletins-manifest.json', 'w') as f:
              json.dump(bulletins, f, indent=2)
              f.write('\n')

          print(f"Generated bulletins-manifest.json with {len(bulletins)} entries")
          print(json.dumps(bulletins, indent=2))
          PYEOF

      - name: Commit updated manifest (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bulletins-manifest.json
          git diff --staged --quiet || git commit -m "chore: refresh bulletins-manifest.json"
          git push
